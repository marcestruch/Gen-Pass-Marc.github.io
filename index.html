<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Marc Estruch Malonda">
    <meta name="description" content="Generador automático de contraseñas">
    <title>Pass Gen | Marc Estruch</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Generador de Contraseñas</h1>
    </header>

    <main>
        <section id="output-section">
            <div id="sal-contra">
                <input type="text" id="contraseña" placeholder="Tu contraseña aparecerá aquí" readonly>
                <button id="copiar">Copiar</button>
            </div>
        </section>

        <section id="options-section">
            <form id="form-config">
                <p>
                    <label for="longitud">Longitud:</label>
                    <input type="number" id="longitud" min="4" max="32" value="12" required>
                </p>

                <p>
                    <label><input type="checkbox" id="mayusculas" checked> Incluir mayúsculas</label><br>
                    <label><input type="checkbox" id="minusculas" checked> Incluir minúsculas</label><br>
                    <label><input type="checkbox" id="numeros" checked> Incluir números</label><br>
                    <label><input type="checkbox" id="simbolos"> Incluir símbolos</label>
                </p>

                <button type="submit" id="generar">Generar contraseña</button>
            </form>
        </section>
    </main>

    <footer>
        <p><i>© 2025 | Marc Estruch Malonda</i></p>
    </footer>

    <script src="js/script.js" defer></script>
</body>
</html>
